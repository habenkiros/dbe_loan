<!-- templates/loans/manage_zones.html -->
{% extends "base.html" %}

{% block title %}Manage Zones{% endblock %}

{% block content %}
<h1>Manage Zones</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Add Zone</button>
</form>
<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
        </tr>
    </thead>
    <tbody>
        {% for zone in zones %}
        <tr>
            <td>{{ zone.id }}</td>
            <td>{{ zone.name }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
