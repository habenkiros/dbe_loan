# Overlay: HTTPS reverse proxy for tablet GPS/camera (secure context).
# Usage:
#   ./scripts/gen_field_https_certs.sh          # all current LAN IPs + each private /24
#   docker compose -f docker-compose.yml -f docker-compose.https.yml up --build
#
# App: https://localhost:8443  or  https://<any-current-server-ip>:8443
# (no need to bake a specific IP into env; re-run the cert script after a new subnet)

services:
  web:
    env_file:
      - deploy/https/.env.https
    environment:
      USE_HTTPS_PROXY: "1"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8443:443"
    volumes:
      - ./deploy/https/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/https/certs:/etc/nginx/certs:ro
    depends_on:
      - web
