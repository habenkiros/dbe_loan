<!-- templates/loans/manage_collateral_types.html -->
{% extends "base.html" %}

{% block title %}Manage Collateral Types{% endblock %}

{% block content %}
<h1>Manage Collateral Types</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Add Collateral Type</button>
</form>
<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
        </tr>
    </thead>
    <tbody>
        {% for collateral_type in collateral_types %}
        <tr>
            <td>{{ collateral_type.id }}</td>
            <td>{{ collateral_type.name }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
