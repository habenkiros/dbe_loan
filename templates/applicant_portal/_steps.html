<ul class="ap-steps" aria-label="Application steps">
  <li class="{% if step == 1 %}is-active{% elif step > 1 %}is-done{% endif %}">1 · Details</li>
  {% if has_product %}
  <li class="{% if step == 2 %}is-active{% elif step > 2 %}is-done{% endif %}">2 · Product file</li>
  <li class="{% if step == 3 %}is-active{% elif step > 3 %}is-done{% endif %}">3 · Documents</li>
  <li class="{% if step == 4 %}is-active{% elif step > 4 %}is-done{% endif %}">4 · Fee</li>
  <li class="{% if step == 5 %}is-active{% elif step > 5 %}is-done{% endif %}">5 · Submit</li>
  {% else %}
  <li class="{% if step == 2 %}is-active{% elif step > 2 %}is-done{% endif %}">2 · Documents</li>
  <li class="{% if step == 3 %}is-active{% elif step > 3 %}is-done{% endif %}">3 · Fee</li>
  <li class="{% if step == 4 %}is-active{% elif step > 4 %}is-done{% endif %}">4 · Submit</li>
  {% endif %}
</ul>
