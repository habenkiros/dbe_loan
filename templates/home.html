<!-- templates/home.html -->
{% extends "base.html" %}
{% load static %}

{% block title %}Home{% endblock %}

{% block content %}
<h1>Welcome to the Loan-Request System</h1>

<!-- Popup Container -->
<div id="promo-popup" class="popup">
    <div class="popup-content">
      <span id="close-popup" class="close">&times;</span>
      <a href="https://play.google.com/store/apps/details?id=com.equb.seqela" target="_blank">
        <img src="{% static 'images/logose.png' %}" alt="Promo Image">
      </a>
    </div>
  </div>

<div class="slideshow-container">
    <div class="mySlides fade">
        <img src="{% static 'images/slide4.png' %}" style="width:100%">
    </div>

    <div class="mySlides fade">
        <img src="{% static 'images/slide2.png' %}" style="width:100%">
    </div>

    <div class="mySlides fade">
        <img src="{% static 'images/slide3.png' %}" style="width:100%">
    </div>

    <!-- Next and previous buttons -->
    <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
    <a class="next" onclick="plusSlides(1)">&#10095;</a>
</div>
<br>

<!-- The dots/circles -->
<div style="text-align:center">
    <span class="dot" onclick="currentSlide(1)"></span> 
    <span class="dot" onclick="currentSlide(2)"></span> 
    <span class="dot" onclick="currentSlide(3)"></span> 
</div>

<script>

    document.addEventListener("DOMContentLoaded", function() {
        const popup = document.getElementById('promo-popup');
        const closePopup = document.getElementById('close-popup');
  
        function showPopup() {
          popup.style.display = 'block';
        }
  
        function hidePopup() {
          popup.style.display = 'none';
        }
  
        // Show popup every 10 seconds
        setInterval(showPopup, 10000);
  
        // Close popup
        closePopup.addEventListener('click', hidePopup);
  
        // Hide popup when clicking outside of the content
        window.addEventListener('click', function(event) {
          if (event.target == popup) {
            hidePopup();
          }
        });
      });

let slideIndex = 0;
showSlides();

function showSlides() {
    let i;
    let slides = document.getElementsByClassName("mySlides");
    let dots = document.getElementsByClassName("dot");
    for (i = 0; i < slides.length; i++) {
        slides[i].style.display = "none";  
    }
    slideIndex++;
    if (slideIndex > slides.length) {slideIndex = 1}    
    for (i = 0; i < dots.length; i++) {
        dots[i].className = dots[i].className.replace(" active", "");
    }
    slides[slideIndex-1].style.display = "block";  
    dots[slideIndex-1].className += " active";
    setTimeout(showSlides, 2000); // Change image every 2 seconds
}

function plusSlides(n) {
    showSlides(slideIndex += n);
}

function currentSlide(n) {
    showSlides(slideIndex = n);
}
</script>

{% endblock %}
