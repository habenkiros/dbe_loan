{% extends "base.html" %}

{% block title %}Create User{% endblock %}

{% block content %}
<h1>Create User</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Create User</button>
</form>
{% endblock %}

{% block extra_scripts %}
<script>
(function () {
  var district = document.getElementById('id_district');
  var branch = document.getElementById('id_branch');
  if (!district || !branch) return;
  var url = "{% url 'ajax_load_branches' %}";

  district.addEventListener('change', function () {
    var districtId = this.value;
    branch.innerHTML = '<option value="">---------</option>';
    if (!districtId) return;
    fetch(url + '?district=' + encodeURIComponent(districtId), {
      credentials: 'same-origin',
      headers: { 'X-Requested-With': 'XMLHttpRequest' },
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        (data || []).forEach(function (b) {
          var opt = document.createElement('option');
          opt.value = b.id;
          opt.textContent = b.name;
          branch.appendChild(opt);
        });
      });
  });
})();
</script>
{% endblock %}
