{% extends "base.html" %}

{% block title %}Edit Loan Category{% endblock %}

{% block content %}
<h1>Edit Loan Category</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save Changes</button>
</form>
<p style="margin-top:1.25rem;">
  <a href="{% url 'manage_loan_category_documents' category.id %}">Configure documents for this loan type →</a>
  · <a href="{% url 'manage_loan_categories' %}">← Back to categories</a>
</p>
{% endblock %}
