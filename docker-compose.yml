# DECSI Loan Hub — local / pilot stack
# Copy .env.example → .env and set SECRET_KEY, DEBUG, ALLOWED_HOSTS, DB_PASSWORD.
#
# HTTPS field tablets:
#   docker compose -f docker-compose.yml -f docker-compose.https.yml up --build

services:
  web:
    build: .
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-decsiloandb}
      DB_USER: ${DB_USER:-decsiloandbuser}
      DB_PASSWORD: ${DB_PASSWORD:-decsiloandbpassword}
    volumes:
      # Live code so UI / partners changes match the host workspace
      - .:/app
      - media_data:/app/media
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-decsiloandb}
      POSTGRES_USER: ${DB_USER:-decsiloandbuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-decsiloandbpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-decsiloandbuser} -d ${DB_NAME:-decsiloandb}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Nightly backup at 00:00 Africa/Addis_Ababa → ./backups/
  backup:
    build:
      context: ./deploy/backup
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-decsiloandb}
      DB_USER: ${DB_USER:-decsiloandbuser}
      DB_PASSWORD: ${DB_PASSWORD:-decsiloandbpassword}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      MEDIA_PATH: /app/media
      TZ: ${BACKUP_TZ:-Africa/Addis_Ababa}
    volumes:
      - ./backups:/backups
      - media_data:/app/media:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:
