<!-- templates/loans/manage_branches.html -->
{% extends "base.html" %}

{% block title %}Manage Branches{% endblock %}

{% block content %}
<h1>Manage Branches</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Add Branch</button>
</form>
<div class="table-container">
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Zone</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for branch in branches %}
            <tr>
                <td>{{ branch.id }}</td>
                <td>{{ branch.name }}</td>
                <td>{{ branch.zone.name }}</td>
                <td><a href="{% url 'edit_branch' branch.id %}">Edit</a></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
