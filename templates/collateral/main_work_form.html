{% extends "base.html" %}
{% block title %}{% if is_edit %}Edit main work{% else %}Add main work{% endif %}{% endblock %}
{% block content %}
<h2>{% if is_edit %}Edit main work{% else %}Add main work{% endif %}</h2>
<p><a href="{% url 'collateral:main_work_list' %}">← Back to main work</a></p>

<form method="post">
    {% csrf_token %}
    <table>
        {{ form.as_table }}
    </table>
    <button type="submit">{% if is_edit %}Save changes{% else %}Add main work{% endif %}</button>
</form>
{% endblock %}
