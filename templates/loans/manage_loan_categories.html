<!-- templates/loans/manage_loan_categories.html -->
{% extends "base.html" %}

{% block title %}Manage Loan Categories{% endblock %}

{% block content %}
<h1>Manage Loan Categories</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Add Loan Category</button>
</form>
<div class="table-container">
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for category in categories %}
            <tr>
                <td>{{ category.id }}</td>
                <td>{{ category.name }}</td>
                <td><a href="{% url 'edit_loan_category' category.id %}">Edit</a></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
