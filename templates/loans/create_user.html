<!-- templates/loans/create_user.html -->
{% extends "base.html" %}

{% block title %}Create User{% endblock %}

{% block content %}
<h1>Create User</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Create User</button>
</form>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script type="text/javascript">
    $(document).ready(function() {
        $('#id_district').change(function() {
            var url = '{% url "ajax_load_branches" %}';
            var districtId = $(this).val();

            $.ajax({                       // Initialize the AJAX request
                url: url,
                data: {
                    'district': districtId
                },
                success: function (data) {   // `data` is the return of the `load_branches` view function
                    $('#id_branch').empty();
                    $('#id_branch').append('<option value="">--- Select Branch ---</option>');
                    $.each(data, function(key, value) {
                        $('#id_branch').append('<option value="' + value.id + '">' + value.name + '</option>');
                    });
                }
            });
        });
    });
</script>
{% endblock %}
