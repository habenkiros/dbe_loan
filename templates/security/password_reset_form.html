<!DOCTYPE html>
<html>
<head>
  <title>Reset password — AI-powered Credit Intelligence</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
  <style>
    body{display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;background:#f4f4f4;font-family:Arial,sans-serif}
    .box{background:#fff;padding:24px;border-radius:8px;box-shadow:0 0 12px rgba(0,128,0,.15);width:360px}
    h1{color:#064420;font-size:1.3rem;text-align:center}
    label{font-weight:bold;display:block;margin:12px 0 4px}
    input{width:100%;padding:10px;box-sizing:border-box;border:1px solid #ddd;border-radius:5px}
    button{margin-top:14px;width:100%;background:#07ae18;color:#fff;border:0;padding:10px;border-radius:5px;cursor:pointer}
    .extra{text-align:center;margin-top:12px;font-size:13px}
    .extra a{color:#064420}
    .err{color:#c00;font-size:13px}
  </style>
</head>
<body>
<div class="box">
  <h1>Reset password</h1>
  <p style="font-size:13px;color:#555;text-align:center">Enter the email on your staff account. If it matches, we send a reset link.</p>
  <form method="post">{% csrf_token %}
    {{ form.email.errors }}
    <label for="id_email">Email</label>
    {{ form.email }}
    <button type="submit">Send reset link</button>
  </form>
  <p class="extra"><a href="{% url 'login' %}">Back to login</a></p>
</div>
</body>
</html>
