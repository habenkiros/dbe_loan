<!-- templates/loans/manage_branches.html -->
{% extends "base.html" %}

{% block title %}Manage Branches{% endblock %}

{% block content %}
<h1>Manage Branches</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Add Branch</button>
</form>
<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Zone</th>
        </tr>
    </thead>
    <tbody>
        {% for branch in branches %}
        <tr>
            <td>{{ branch.id }}</td>
            <td>{{ branch.name }}</td>
            <td>{{ branch.zone.name }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
